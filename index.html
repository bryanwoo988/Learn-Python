  /* Before anything paints: apply the saved mode and theme so a dark phone never
     flashes white. Mirrors applyTheme() in js/app.js. */
  (function () {
    var p = {};
    try { p = JSON.parse(localStorage.getItem('pysyntax.prefs') || '{}') || {}; } catch (e) {}
    var mode = ['light', 'dark'].indexOf(p.mode) >= 0 ? p.mode : 'system';
    var dark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
    var side = mode === 'system' ? (dark ? 'dark' : 'light') : mode;
    var ok = { light: ['classic', 'paper', 'mint', 'lavender'], dark: ['midnight', 'oled', 'slate', 'grape'] };
    var r = document.documentElement;
    r.dataset.theme = side;
    r.dataset.palette = ok[side].indexOf(p[side]) >= 0 ? p[side] : ok[side][0];
  })();
  </script>
